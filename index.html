<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============================================================
       HEADER — Total Balance (always at top, above all content)
  ============================================================= -->
  <header class="app-header" role="banner">
    <h1 class="app-title">Expense &amp; Budget Visualizer</h1>
    <div class="balance-wrapper">
      <span class="balance-label">Total Balance</span>
      <span
        id="total-balance"
        class="balance-amount"
        aria-live="polite"
        aria-atomic="true"
        aria-label="Total balance"
      >$0.00</span>
    </div>
  </header>

  <main class="app-main">

    <!-- ============================================================
         INPUT FORM — Add a new transaction
    ============================================================= -->
    <section class="card form-section" aria-labelledby="form-heading">
      <h2 id="form-heading" class="section-title">Add Transaction</h2>

      <form id="transaction-form" novalidate>
        <!-- Item Name -->
        <div class="field-group">
          <label for="item-name" class="field-label">Item Name</label>
          <input
            type="text"
            id="item-name"
            name="item-name"
            class="field-input"
            maxlength="100"
            placeholder="e.g. Coffee"
            autocomplete="off"
            aria-describedby="error-item-name"
            aria-required="true"
          />
          <span class="inline-error" id="error-item-name" role="alert" aria-live="assertive"></span>
        </div>

        <!-- Amount -->
        <div class="field-group">
          <label for="amount" class="field-label">Amount ($)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            class="field-input"
            min="0.01"
            max="999999999.99"
            step="0.01"
            placeholder="0.00"
            aria-describedby="error-amount"
            aria-required="true"
          />
          <span class="inline-error" id="error-amount" role="alert" aria-live="assertive"></span>
        </div>

        <!-- Category -->
        <div class="field-group">
          <label for="category" class="field-label">Category</label>
          <select
            id="category"
            name="category"
            class="field-input"
            aria-describedby="error-category"
            aria-required="true"
          >
            <option value="">— Select a category —</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="inline-error" id="error-category" role="alert" aria-live="assertive"></span>
        </div>

        <button type="submit" class="btn btn--primary">Add Transaction</button>
      </form>

      <!-- Custom Category Sub-form -->
      <div class="custom-category-wrapper">
        <h3 class="subsection-title">Add Custom Category</h3>
        <form id="add-category-form" novalidate>
          <div class="field-group field-group--inline">
            <label for="custom-category" class="field-label">New Category Name</label>
            <input
              type="text"
              id="custom-category"
              name="custom-category"
              class="field-input"
              maxlength="50"
              placeholder="e.g. Gym"
              autocomplete="off"
              aria-describedby="error-custom-category"
            />
            <button type="submit" class="btn btn--secondary">Add Category</button>
          </div>
          <span class="inline-error" id="error-custom-category" role="alert" aria-live="assertive"></span>
        </form>
      </div>
    </section>

    <div class="app-columns">

      <!-- ============================================================
           TRANSACTION LIST — Scrollable panel
      ============================================================= -->
      <section class="card list-section" aria-labelledby="list-heading">
        <div class="list-section__header">
          <h2 id="list-heading" class="section-title">Transactions</h2>

          <!-- Sort Control -->
          <div id="sort-control" class="sort-control">
            <label for="sort-select" class="sort-label">Sort by:</label>
            <select id="sort-select" class="sort-select">
              <option value="">— No sort —</option>
              <option value="amount-asc">Amount: Low to High</option>
              <option value="amount-desc">Amount: High to Low</option>
              <option value="category-asc">Category: A–Z</option>
            </select>
          </div>
        </div>

        <ul
          id="transaction-list"
          class="transaction-list"
          aria-label="Transaction list"
          aria-live="polite"
        >
          <li class="transaction-list__empty" id="empty-list-message">
            No transactions yet
          </li>
        </ul>
      </section>

      <!-- ============================================================
           PIE CHART — Spending distribution
      ============================================================= -->
      <section class="card chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading" class="section-title">Spending by Category</h2>
        <div class="chart-container">
          <canvas
            id="pie-chart"
            role="img"
            aria-label="Spending distribution pie chart"
          ></canvas>
          <div
            id="chart-placeholder"
            class="chart-placeholder"
            aria-live="polite"
          >
            No spending data available
          </div>
        </div>
      </section>

    </div><!-- /.app-columns -->

    <!-- ============================================================
         MONTHLY SUMMARY — Month-by-month breakdown
    ============================================================= -->
    <section class="card summary-section" aria-labelledby="summary-heading">
      <h2 id="summary-heading" class="section-title">Monthly Summary</h2>
      <div class="summary-controls">
        <label for="month-select" class="field-label">Select Month:</label>
        <select
          id="month-select"
          class="field-input month-select"
          aria-label="Select month for summary"
        >
          <!-- Options populated by JS -->
        </select>
      </div>
      <div
        id="monthly-summary"
        class="monthly-summary"
        aria-live="polite"
        aria-label="Monthly summary"
      >
        <!-- Populated by JS -->
      </div>
    </section>

  </main>

  <!-- ============================================================
       TOAST CONTAINER — Fixed-position notification area
  ============================================================= -->
  <div
    id="toast-container"
    class="toast-container"
    aria-live="polite"
    aria-atomic="false"
  ></div>

  <!-- ============================================================
       SCRIPTS
  ============================================================= -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"
    onerror="window.chartJsLoadFailed = true;"
  ></script>
  <script src="js/app.js" defer></script>

</body>
</html>
